name: cancherito
description: "Cancherito - reserva de canchas locales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de datos local
  sqflite: ^2.4.4+2
  path: ^1.9.0

  # Firebase y Google Sign In
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  
  # Notificaciones Push (Semana 6)
  firebase_messaging: ^15.2.10

  # Código QR de acceso a la cancha
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - img/logo.jpeg